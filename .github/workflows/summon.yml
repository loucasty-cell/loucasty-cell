name: Doomsday Console & Summon System

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  handle-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Process Summon Request
        id: process
        run: |
          TITLE="${{ github.event.issue.title }}"
          USER="${{ github.event.issue.user.login }}"
          echo "Processing issue: $TITLE from $USER"

          if [[ "$TITLE" =~ ^summon:[[:space:]]*(.+)$ ]]; then
            TARGET="${BASH_REMATCH[1]}"
            TARGET=$(echo "$TARGET" | tr '[:upper:]' '[:lower:]' | xargs)
            
            case "$TARGET" in
              "dr-doom"|"doom") NAME="DR. DOOM" ;;
              "iron-man"|"ironman") NAME="IRON MAN" ;;
              "spider-man"|"spiderman"|"spidey") NAME="SPIDER-MAN" ;;
              "thor") NAME="THOR" ;;
              "dr-strange"|"strange") NAME="DR. STRANGE" ;;
              "cap"|"captain-america") NAME="CAPTAIN AMERICA" ;;
              "hulk") NAME="HULK" ;;
              "black-panther"|"panther") NAME="BLACK PANTHER" ;;
              "loki") NAME="LOKI" ;;
              *) NAME="DR. DOOM" ;;
            esac

            python3 -c "
            import re
            with open('README.md', 'r') as f:
                content = f.read()
            new_status = '> **Active Sector Lead:** \`$NAME\` · Last summoned by \`@$USER\`'
            pattern = r'(<!-- DOOMSDAY_STATUS:START -->\n).*?(\n<!-- DOOMSDAY_STATUS:END -->)'
            updated = re.sub(pattern, rf'\g<1>{new_status}\g<2>', content, flags=re.DOTALL)
            with open('README.md', 'w') as f:
                f.write(updated)
            "

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore(telemetry): summon $NAME by @$USER [skip ci]" || echo "No changes"
            git push

            echo "comment=⚡ **$NAME** has taken active sector command of the Doomsday stage, summoned by @$USER!" >> $GITHUB_OUTPUT
            echo "action=close" >> $GITHUB_OUTPUT

          elif [[ "$TITLE" =~ ^espresso:[[:space:]]*refill ]]; then
            echo "comment=☕ Desk mascot espresso refilled by @$USER! Energy levels restored to 100%." >> $GITHUB_OUTPUT
            echo "action=close" >> $GITHUB_OUTPUT

          elif [[ "$TITLE" =~ ^ping: ]]; then
            echo "comment=⚡ Signal acknowledged from @$USER! Telemetry received at Sector 616." >> $GITHUB_OUTPUT
            echo "action=close" >> $GITHUB_OUTPUT
          fi

      - name: Respond and Close Issue
        if: steps.process.outputs.action == 'close'
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `${{ steps.process.outputs.comment }}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
