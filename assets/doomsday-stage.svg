<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 210" width="840" height="210" role="img" aria-label="Marvel Doomsday animated pixel character stage">
  <defs>
    <pattern id="cacao-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2A231F" />
    </pattern>
    <radialGradient id="doom-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4B7A57" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#14110F" stop-opacity="0" />
    </radialGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .pixel { shape-rendering: crispEdges; }

      /* Character Motion Loops */
      .spidey-swing { animation: pendulum 2.9s ease-in-out infinite; }
      .iron-hover { animation: iron-flight 3.8s ease-in-out infinite; }
      .iron-flame { animation: flicker 0.35s steps(2, end) infinite; }
      .strange-float { animation: levitate 3.4s ease-in-out infinite; }
      .strange-ring { animation: spin-rune 5s linear infinite; }
      .doom-float { animation: levitate-slow 4.2s ease-in-out infinite; }
      .doom-magic { animation: pulse-magic 1.8s ease-in-out infinite; }
      .thor-hover { animation: levitate 3.1s ease-in-out 0.6s infinite; }
      .thor-zap { animation: lightning 3.6s steps(1, end) infinite; }
      .loki-phase { animation: trickster 4.4s ease-in-out infinite; }
      .cap-patrol { animation: patrol-cap 5.4s ease-in-out infinite; }
      .panther-prowl { animation: prowl 3.2s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
      .hulk-stomp { animation: stomp 3.0s ease-in-out infinite; }
      .hulk-dust { animation: dust-burst 3.0s ease-out infinite; }

      @keyframes pendulum {
        0%, 100% { transform: rotate(-24deg); }
        50% { transform: rotate(24deg); }
      }
      @keyframes iron-flight {
        0%, 100% { transform: translate(-16px, 4px); }
        50% { transform: translate(16px, -8px); }
      }
      @keyframes flicker {
        0%, 100% { opacity: 1; transform: scaleY(1); }
        50% { opacity: 0.45; transform: scaleY(0.65); }
      }
      @keyframes levitate {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes levitate-slow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes spin-rune {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulse-magic {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 1; }
      }
      @keyframes lightning {
        0%, 72%, 100% { opacity: 0; }
        74%, 78% { opacity: 1; }
        80% { opacity: 0.25; }
        83%, 86% { opacity: 0.95; }
      }
      @keyframes trickster {
        0%, 38%, 100% { opacity: 1; transform: translate(0px, 0px); }
        46% { opacity: 0.15; transform: translate(-14px, -4px); }
        54% { opacity: 0.95; transform: translate(16px, -6px); }
        82% { opacity: 0.95; transform: translate(16px, 0px); }
        90% { opacity: 0.15; transform: translate(4px, -2px); }
      }
      @keyframes patrol-cap {
        0%, 100% { transform: translate(-42px, 0px); }
        25% { transform: translate(0px, -2px); }
        50% { transform: translate(48px, 0px); }
        75% { transform: translate(0px, -2px); }
      }
      @keyframes prowl {
        0%, 100% { transform: translate(-40px, 0px); }
        45% { transform: translate(38px, -4px); }
        55% { transform: translate(42px, 0px); }
      }
      @keyframes stomp {
        0%, 60%, 100% { transform: translateY(0px); }
        70% { transform: translateY(2px); }
        82% { transform: translateY(-16px); }
        92% { transform: translateY(0px); }
      }
      @keyframes dust-burst {
        0%, 89%, 100% { opacity: 0; transform: scaleX(0.6); }
        93% { opacity: 0.9; transform: scaleX(1.15); }
        98% { opacity: 0; transform: scaleX(1.45); }
      }

      @media (prefers-reduced-motion: reduce) {
        .spidey-swing, .iron-hover, .iron-flame, .strange-float, .strange-ring,
        .doom-float, .doom-magic, .thor-hover, .thor-zap, .loki-phase,
        .cap-patrol, .panther-prowl, .hulk-stomp, .hulk-dust {
          animation: none;
        }
      }
    </style>
  </defs>

  <!-- Background Stage Frame -->
  <rect x="2" y="2" width="836" height="206" rx="16" fill="#14110F" stroke="#3A332E" stroke-width="2" />
  <rect x="10" y="10" width="820" height="190" rx="12" fill="url(#cacao-dots)" />

  <!-- Top Sector Terminal Bar -->
  <text x="28" y="28" fill="#7E7268" font-size="10.5" font-weight="600" letter-spacing="1" class="mono">DOOMSDAY // SECTOR 616 PIXEL STAGE</text>
  <circle cx="718" cy="24.5" r="3" fill="#72B07D" class="doom-magic" />
  <text x="812" y="28" text-anchor="end" fill="#A6998E" font-size="10.5" font-weight="600" letter-spacing="0.6" class="mono">9 ENTITIES LIVE</text>
  <line x1="24" y1="36" x2="816" y2="36" stroke="#26201C" stroke-width="1" />

  <!-- Scenery Architecture -->
  <g class="pixel" fill="#1B1613">
    <rect x="34" y="138" width="46" height="40" />
    <rect x="92" y="152" width="34" height="26" />
    <rect x="366" y="128" width="108" height="50" />
    <rect x="384" y="114" width="72" height="14" />
    <rect x="742" y="142" width="58" height="36" />
  </g>
  <line x1="24" y1="178" x2="816" y2="178" stroke="#3A332E" stroke-width="2" />
  <line x1="24" y1="182" x2="816" y2="182" stroke="#1F1A17" stroke-width="3" />

  <!-- Dr. Doom Ambient Aura -->
  <circle cx="420" cy="84" r="64" fill="url(#doom-aura)" class="doom-magic" />

