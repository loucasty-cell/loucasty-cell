      <rect x="-10" y="-2" width="4" height="5" fill="#EDE4DA" />
      <rect x="6" y="-2" width="4" height="5" fill="#EDE4DA" />
      <rect x="-5" y="5" width="10" height="5" fill="#D4A789" />
      <rect x="-4" y="8" width="8" height="2" fill="#C89B54" />
      <rect x="-7" y="10" width="14" height="13" fill="#363A40" />
