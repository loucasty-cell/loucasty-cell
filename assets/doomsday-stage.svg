    <g class="strange-float pixel">
      <rect x="-11" y="3" width="22" height="24" fill="#7A2A26" />
      <rect x="-12" y="2" width="5" height="8" fill="#913530" />
      <rect x="7" y="2" width="5" height="8" fill="#913530" />
