        <rect x="-20" y="8" width="2" height="2" fill="#EDE4DA" />
        <rect x="16" y="6" width="6" height="6" fill="#72B07D" />
        <rect x="18" y="8" width="2" height="2" fill="#EDE4DA" />
      </g>
      <rect x="-8" y="27" width="6" height="6" fill="#767C82" />
      <rect x="2" y="27" width="6" height="6" fill="#767C82" />
