      <rect x="-1" y="0" width="2" height="54" fill="#D8CFC4" opacity="0.75" />
      <rect x="-3" y="50" width="6" height="4" fill="#A83E3B" />
      <rect x="-6" y="54" width="12" height="9" fill="#A83E3B" />
      <rect x="-5" y="57" width="4" height="3" fill="#EDE4DA" />
