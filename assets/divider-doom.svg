<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 36" width="840" height="36" role="img" aria-label="Dr. Doom floating pixel divider">
  <defs>
    <clipPath id="doom-bounds">
      <rect x="0" y="0" width="840" height="36" />
    </clipPath>
    <linearGradient id="doom-trail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4B7A57" stop-opacity="0" />
      <stop offset="72%" stop-color="#4B7A57" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#72B07D" stop-opacity="0.95" />
    </linearGradient>
    <style>
      .pixel { shape-rendering: crispEdges; }
      .doom-travel { animation: doom-glide 11s linear infinite; }
      .doom-hover { animation: doom-float 2.4s ease-in-out infinite; }
      .doom-orb { animation: orb-pulse 1.1s ease-in-out infinite; }
      .doom-sparks { animation: spark-flicker 0.65s steps(2, end) infinite; }
      .doom-wake { animation: wake-doom 11s linear infinite; }

      @keyframes doom-glide {
        0% { transform: translateX(-60px); }
        76% { transform: translateX(900px); }
        100% { transform: translateX(900px); }
      }
      @keyframes doom-float {
        0%, 100% { transform: translateY(-2px); }
        50% { transform: translateY(2px); }
      }
      @keyframes orb-pulse {
        0%, 100% { opacity: 0.65; }
        50% { opacity: 1; }
      }
      @keyframes spark-flicker {
        0%, 100% { opacity: 1; transform: translateX(0px); }
        50% { opacity: 0.3; transform: translateX(2px); }
      }
      @keyframes wake-doom {
        0% { transform: translateX(-200px); opacity: 0; }
        8% { opacity: 1; }
        76% { transform: translateX(760px); opacity: 0; }
        100% { transform: translateX(760px); opacity: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        .doom-travel { animation: none; transform: translateX(420px); }
        .doom-hover, .doom-orb, .doom-sparks { animation: none; transform: none; }
        .doom-wake { animation: none; opacity: 0; }
      }
    </style>
  </defs>

  <line x1="8" y1="18" x2="832" y2="18" stroke="#2F2824" stroke-width="1.5" />
  <rect x="0" y="14" width="2" height="8" rx="1" fill="#3A332E" />
  <rect x="838" y="14" width="2" height="8" rx="1" fill="#3A332E" />

  <g clip-path="url(#doom-bounds)">
    <rect class="doom-wake" x="0" y="17" width="140" height="2" rx="1" fill="url(#doom-trail)" />

    <g transform="translate(0, 18)">
      <g class="doom-travel">
        <g class="doom-hover pixel">
          <rect x="-12" y="-4" width="10" height="12" fill="#32523B" />
          <rect x="-16" y="2" width="6" height="6" fill="#32523B" />
          <rect x="-18" y="6" width="4" height="2" fill="#263F2D" />

          <rect x="-6" y="-12" width="10" height="2" fill="#4B7A57" />
          <rect x="-8" y="-10" width="4" height="6" fill="#4B7A57" />
          <rect x="2" y="-10" width="2" height="6" fill="#4B7A57" />
          <rect x="-4" y="-10" width="6" height="6" fill="#9EA3A8" />
          <rect x="-1" y="-8" width="3" height="2" fill="#14110F" />
          <rect x="0" y="-8" width="2" height="1" fill="#72B07D" />

          <rect x="-4" y="-4" width="8" height="10" fill="#4B7A57" />
          <rect x="-2" y="-4" width="6" height="6" fill="#858B91" />
          <rect x="-4" y="-4" width="2" height="2" fill="#C89B54" />
          <rect x="0" y="-4" width="2" height="2" fill="#C89B54" />
          <rect x="-4" y="2" width="8" height="2" fill="#63493A" />

          <rect x="-4" y="6" width="3" height="5" fill="#767C82" />
          <rect x="1" y="6" width="3" height="5" fill="#767C82" />

          <rect x="4" y="-2" width="6" height="3" fill="#9EA3A8" />

          <g class="doom-orb">
            <rect x="11" y="-4" width="6" height="6" fill="#72B07D" />
            <rect x="13" y="-2" width="2" height="2" fill="#EDE4DA" />
          </g>
          <g class="doom-sparks">
            <rect x="18" y="-2" width="2" height="2" fill="#72B07D" />
            <rect x="13" y="-7" width="2" height="2" fill="#72B07D" />
            <rect x="13" y="3" width="2" height="2" fill="#4B7A57" />
            <rect x="21" y="-5" width="2" height="2" fill="#EDE4DA" />
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
