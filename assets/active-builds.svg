<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 316" width="840" height="316" role="img" aria-label="Active Builds - High-End Minimalist UI Cards">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 16.5px; fill: #F7F4EE; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 11px; fill: #A8A29E; line-height: 1.5; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      
      .status-pulse { animation: subtle-pulse 3s ease-in-out infinite; }
      @keyframes subtle-pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      
      @media (prefers-reduced-motion: reduce) {
        .status-pulse { animation: none; }
      }
    </style>
  </defs>

  <!-- ============================================================== -->
  <!-- CARD 1: bookflow (Top Left)                                    -->
  <!-- ============================================================== -->
  <g transform="translate(0, 0)">
    <!-- Base Card Surface -->
    <rect x="0" y="0" width="410" height="148" rx="12" fill="#141210" stroke="#2B2623" stroke-width="1.2" />
    <line x1="12" y1="1" x2="398" y2="1" stroke="#3D3631" stroke-width="1" stroke-linecap="round" />

    <!-- Domain Tag -->
    <text x="18" y="26" fill="#8C827A" font-size="9" font-weight="600" letter-spacing="1" class="mono">AGENTIC REASONING // REACT</text>

    <!-- Status Indicator Pill -->
    <rect x="330" y="14" width="62" height="19" rx="6" fill="#1C1917" stroke="#332D28" stroke-width="1" />
    <circle cx="342" cy="23.5" r="3" fill="#72B07D" class="status-pulse" />
    <text x="351" y="27" fill="#D6D0C7" font-size="8.5" font-weight="600" letter-spacing="0.5" class="mono">ACTIVE</text>

    <!-- Project Title -->
    <text x="18" y="58" class="title">bookflow</text>

    <!-- Description -->
    <text x="18" y="78" class="desc">Autonomous ReAct prompting loop with verified tool execution,</text>
    <text x="18" y="94" class="desc">structured reasoning chains, and minimal reader interface.</text>

    <!-- Tech Stack Tags -->
    <g transform="translate(18, 112)">
      <rect x="0" y="0" width="76" height="20" rx="5" fill="#1B1815" stroke="#2B2521" stroke-width="1" />
      <text x="38" y="14" fill="#DDD6CC" font-size="9" font-weight="500" text-anchor="middle" class="mono">TypeScript</text>

      <rect x="84" y="0" width="84" height="20" rx="5" fill="#1B1815" stroke="#2B2521" stroke-width="1" />
      <text x="126" y="14" fill="#DDD6CC" font-size="9" font-weight="500" text-anchor="middle" class="mono">ReAct Loop</text>

      <rect x="176" y="0" width="90" height="20" rx="5" fill="#1B1815" stroke="#2B2521" stroke-width="1" />
      <text x="221" y="14" fill="#DDD6CC" font-size="9" font-weight="500" text-anchor="middle" class="mono">Tool Sandbox</text>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- CARD 2: AgriQill / AgroGuard (Top Right)                       -->
  <!-- ============================================================== -->
  <g transform="translate(430, 0)">
    <!-- Base Card Surface -->
    <rect x="0" y="0" width="410" height="148" rx="12" fill="#141210" stroke="#2B2623" stroke-width="1.2" />
    <line x1="12" y1="1" x2="398" y2="1" stroke="#3D3631" stroke-width="1" stroke-linecap="round" />

    <!-- Domain Tag -->
    <text x="18" y="26" fill="#8C827A" font-size="9" font-weight="600" letter-spacing="1" class="mono">SPATIAL GIS // DIGITAL TWIN</text>

    <!-- Status Indicator Pill -->
    <rect x="306" y="14" width="86" height="19" rx="6" fill="#1C1917" stroke="#332D28" stroke-width="1" />
    <circle cx="318" cy="23.5" r="3" fill="#C4A24E" class="status-pulse" />
    <text x="327" y="27" fill="#D6D0C7" font-size="8.5" font-weight="600" letter-spacing="0.5" class="mono">IN PROGRESS</text>

    <!-- Project Title -->
    <text x="18" y="58" class="title">AgriQill / AgroGuard</text>

    <!-- Description -->
    <text x="18" y="78" class="desc">Isometric GIS digital twin, custom .agri DSL AST parser,</text>
    <text x="18" y="94" class="desc">LoRaWAN sensor telemetry, and Open-Meteo climate modeling.</text>

    <!-- Tech Stack Tags -->
    <g transform="translate(18, 112)">
      <rect x="0" y="0" width="58" height="20" rx="5" fill="#1B1815" stroke="#2B2521" stroke-width="1" />
      <text x="29" y="14" fill="#DDD6CC" font-size="9" font-weight="500" text-anchor="middle" class="mono">FastAPI</text>

      <rect x="66" y="0" width="76" height="20" rx="5" fill="#1B1815" stroke="#2B2521" stroke-width="1" />
      <text x="104" y="14" fill="#DDD6CC" font-size="9" font-weight="500" text-anchor="middle" class="mono">Deck.gl GIS</text>

      <rect x="150" y="0" width="76" height="20" rx="5" fill="#1B1815" stroke="#2B2521" stroke-width="1" />
      <text x="188" y="14" fill="#DDD6CC" font-size="9" font-weight="500" text-anchor="middle" class="mono">Custom DSL</text>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- CARD 3: Petey Plant (Bottom Left)                              -->
  <!-- ============================================================== -->
  <g transform="translate(0, 166)">
    <!-- Base Card Surface -->
    <rect x="0" y="0" width="410" height="148" rx="12" fill="#141210" stroke="#2B2623" stroke-width="1.2" />
    <line x1="12" y1="1" x2="398" y2="1" stroke="#3D3631" stroke-width="1" stroke-linecap="round" />

    <!-- Domain Tag -->
    <text x="18" y="26" fill="#8C827A" font-size="9" font-weight="600" letter-spacing="1" class="mono">COMPUTER VISION // DIAGNOSTICS</text>

    <!-- Status Indicator Pill -->
    <rect x="316" y="14" width="76" height="19" rx="6" fill="#1C1917" stroke="#332D28" stroke-width="1" />
    <circle cx="328" cy="23.5" r="3" fill="#A89F91" class="status-pulse" />
    <text x="337" y="27" fill="#D6D0C7" font-size="8.5" font-weight="600" letter-spacing="0.5" class="mono">PROTOTYPE</text>

    <!-- Project Title -->
    <text x="18" y="58" class="title">Petey Plant</text>

    <!-- Description -->
    <text x="18" y="78" class="desc">Agentic plant pathology classifier fine-tuned on PlantNet-300K</text>
    <text x="18" y="94" class="desc">paired with interactive Three.js 3D growth telemetry.</text>

    <!-- Tech Stack Tags -->
    <g transform="translate(18, 112)">
      <rect x="0" y="0" width="60" height="20" rx="5" fill="#1B1815" stroke="#2B2521" stroke-width="1" />
      <text x="30" y="14" fill="#DDD6CC" font-size="9" font-weight="500" text-anchor="middle" class="mono">PyTorch</text>

      <rect x="68" y="0" width="94" height="20" rx="5" fill="#1B1815" stroke="#2B2521" stroke-width="1" />
      <text x="115" y="14" fill="#DDD6CC" font-size="9" font-weight="500" text-anchor="middle" class="mono">PlantNet-300K</text>

      <rect x="170" y="0" width="66" height="20" rx="5" fill="#1B1815" stroke="#2B2521" stroke-width="1" />
      <text x="203" y="14" fill="#DDD6CC" font-size="9" font-weight="500" text-anchor="middle" class="mono">Three.js</text>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- CARD 4: CrisisGuardAI (Bottom Right)                           -->
  <!-- ============================================================== -->
  <g transform="translate(430, 166)">
    <!-- Base Card Surface -->
    <rect x="0" y="0" width="410" height="148" rx="12" fill="#141210" stroke="#2B2623" stroke-width="1.2" />
    <line x1="12" y1="1" x2="398" y2="1" stroke="#3D3631" stroke-width="1" stroke-linecap="round" />

    <!-- Domain Tag -->
    <text x="18" y="26" fill="#8C827A" font-size="9" font-weight="600" letter-spacing="1" class="mono">DECISION SUPPORT // NLP TRIAGE</text>

    <!-- Status Indicator Pill -->
    <rect x="330" y="14" width="62" height="19" rx="6" fill="#1C1917" stroke="#332D28" stroke-width="1" />
    <circle cx="342" cy="23.5" r="3" fill="#72B07D" class="status-pulse" />
    <text x="351" y="27" fill="#D6D0C7" font-size="8.5" font-weight="600" letter-spacing="0.5" class="mono">ACTIVE</text>

    <!-- Project Title -->
    <text x="18" y="58" class="title">CrisisGuardAI</text>

    <!-- Description -->
    <text x="18" y="78" class="desc">AI-driven emergency decision support, disaster triage telemetry</text>
    <text x="18" y="94" class="desc">orchestration, and real-time NLP incident dispatch.</text>

    <!-- Tech Stack Tags -->
    <g transform="translate(18, 112)">
      <rect x="0" y="0" width="76" height="20" rx="5" fill="#1B1815" stroke="#2B2521" stroke-width="1" />
      <text x="38" y="14" fill="#DDD6CC" font-size="9" font-weight="500" text-anchor="middle" class="mono">NLP Triage</text>

      <rect x="84" y="0" width="76" height="20" rx="5" fill="#1B1815" stroke="#2B2521" stroke-width="1" />
      <text x="122" y="14" fill="#DDD6CC" font-size="9" font-weight="500" text-anchor="middle" class="mono">TypeScript</text>

      <rect x="168" y="0" width="60" height="20" rx="5" fill="#1B1815" stroke="#2B2521" stroke-width="1" />
      <text x="198" y="14" fill="#DDD6CC" font-size="9" font-weight="500" text-anchor="middle" class="mono">FastAPI</text>
    </g>
  </g>
</svg>
